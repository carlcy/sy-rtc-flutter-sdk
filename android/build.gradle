// @formatter:off
// IDE inspection disabled - this file uses valid Gradle syntax
// @formatter:on

group = "com.sy.rtc.flutter"
version = "3.2.1"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // 同一坐标已 publishToMavenLocal 时先用本地产物（JitPack tag v3.2.0 已发布）。
        // 客户机器上没有这份本地包时，解析会落到下面的 JitPack。
        mavenLocal()
        maven { url 'https://jitpack.io' }  // JitPack 仓库（用于 Android SDK）
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.sy.rtc.flutter"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    // 原生 Android SDK 3.2.0（3.2.1 只改了 iOS 依赖方式）。
    // https://jitpack.io/#carlcy/sy-rtc-android-sdk/v3.2.0
    // api：依赖会传递给宿主 App，业务工程不必再声明这份坐标，
    // 但宿主必须能解析 https://jitpack.io （见 README「平台配置」）。
    api("com.github.carlcy:sy-rtc-android-sdk:v3.2.0")

    testImplementation("org.jetbrains.kotlin:kotlin-test")
    testImplementation("org.mockito:mockito-core:5.0.0")
}
